
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu ngang Dropdown</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            margin: 30px;
            color: #333;
        }

        #menu {
            height: 50px;
            background-color: #222;
            border: 1px solid #444;
        }

        #menu ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        #menu > ul > li {
            float: left;
            position: relative;
        }

        #menu a {
            display: block;
            width: 150px;
            height: 48px;
            line-height: 48px;
            text-align: center;
            text-decoration: none;
            color: white;
        }

        #menu a:hover {
            background-color: red;
        }

        /* Menu con */
        #menu ul ul {
            position: absolute;
            top: 48px;
            left: 0;
            visibility: hidden;
            background-color: #222;
        }

        /* Hiện menu con khi rê chuột vào mục cha */
        #menu ul li:hover > ul {
            visibility: visible;
        }
    </style>
</head>

<body>
    <h1>Menu ngang Dropdown</h1>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm ▼</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ ▼</a>
                <ul>
                    <li><a href="#">Tư vấn</a></li>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Hỗ trợ</a></li>
                </ul>
            </li>

            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>
</body>
</html>
