
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu dọc Dropdown</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        #menu,
        #menu ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        #menu {
            width: 160px;
        }

        #menu li {
            position: relative;
            width: 160px;
            height: 40px;
            line-height: 40px;
            background-color: black;
            cursor: pointer;
        }

        #menu li a {
            display: block;
            padding: 0 20px;
            color: white;
            text-decoration: none;
        }

        #menu li:hover {
            background-color: #555;
        }

        /* Menu con */
        #menu li ul {
            position: absolute;
            top: 0;
            left: 160px;
            visibility: hidden;
        }

        /* Hiện menu con khi di chuột */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>

<body>
    <h1>Menu dọc Dropdown</h1>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm ▸</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ ▸</a>
                <ul>
                    <li><a href="#">Tư vấn</a></li>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Hỗ trợ</a></li>
                </ul>
            </li>

            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>
</body>
</html>
